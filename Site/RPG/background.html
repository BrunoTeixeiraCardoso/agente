<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Background</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="rpg-layout">
    <div id="sidebar"></div>

    <main class="main-content">
        <div class="dice-roll-area">
            <button class="roll-btn" type="button" id="roll-btn">Escolher Background Aleatório</button>
            <div class="roll-data">
                <div>
                    <p class="roll-result-label">Resultado</p>
                    <div id="roll-result" class="roll-result" aria-live="polite">--</div>
                </div>
                <div class="roll-keyword-block">
                    <p class="roll-result-label">Background</p>
                    <div id="roll-keyword" class="roll-keyword" aria-live="polite">--</div>
                </div>
            </div>
        </div>

        <div class="dnd-table-container">
            <table id="table-background" data-json="background-table.json" data-index-header="Número" data-value-header-male="Background" data-value-key-male="col1">
                <thead>
                    <tr>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="2" class="loading">Carregando dados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="main.js"></script>
<script src="table-page.js"></script>

</body>
</html>
